[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-data-mart"
version = "0.1.0"
description = "Recruiting analytics data mart over candidate/application pipeline data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ayush Gawai" }]
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
airflow = ["apache-airflow>=2.9"]
dev = ["pytest>=8.0"]

[project.scripts]
recmart = "recmart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
